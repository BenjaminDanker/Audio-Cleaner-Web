[project]
name = "acw-common"
version = "1.0.0"
description = "Audio Cleaner: processing code shared by the server and the desktop app"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2",
  "scipy>=1.13",
  "pyloudnorm>=0.1",
]

[tool.setuptools.packages.find]
include = ["acw_common*"]

[tool.setuptools.package-data]
acw_common = ["reco_model.json"]  # the trees of "Automatic best settings" (reco_model.py reads it next to itself)

[tool.pytest.ini_options]
testpaths = ["tests"]
