[project]
name = "acw-common"
version = "1.0.0"
description = "Audio Cleaner: processing code shared by the server and the desktop app"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2",
  "scipy>=1.13",
  "pyloudnorm>=0.1",
]

[tool.setuptools.packages.find]
include = ["acw_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
