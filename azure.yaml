# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: audio-cleaner-web
metadata:
  template: audio-cleaner-web@0.0.1-beta

variables:
  AZURE_ENV_NAME: "audio-cleaner-${AZURE_ENV_NAME}"

services:
  web:
    project: ./frontend
    host: staticwebapp
    language: js

  api:
    project: ./api
    language: js
    host: function
    
  processor:
    project: .
    language: py
    host: containerapp
