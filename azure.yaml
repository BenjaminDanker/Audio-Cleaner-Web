# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: audio-cleaner-web
metadata:
  template: audio-cleaner-web@0.0.1-beta

variables:
  AZURE_ENV_NAME: "audio-cleaner-${AZURE_ENV_NAME}"

hooks:
  prepackage:
    windows:
      shell: pwsh
      run: |
        Write-Host "Building frontend..."
        cd frontend
        npm install
        npm run build
        cd ..
        Write-Host "Installing API dependencies..."
        cd api
        npm install
        npm prune --production
        cd ..
    posix:
      shell: bash
      run: |
        echo "Building frontend..."
        cd frontend
        npm install
        npm run build
        cd ..
        echo "Installing API dependencies..."
        cd api
        npm install
        npm prune --production
        cd ..

services:
  web:
    project: ./frontend
    dist: ./dist
    api: ../api
    host: staticwebapp
    language: js
    
  processor:
    project: .
    language: py
    host: containerapp
