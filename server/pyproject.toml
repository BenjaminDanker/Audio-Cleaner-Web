[project]
name = "acw"
version = "0.2.0"
description = "Audio Cleaner: on-prem denoise, transcription and live-stream processing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "stripe>=12",
  "numpy>=2",
  "scipy>=1.13",
  "soundfile>=0.12",
  "pyloudnorm>=0.1",
  "faster-whisper>=1.1",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["acw*"]
