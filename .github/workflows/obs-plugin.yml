# Builds the Audio Cleaner OBS plugin for Windows x64, macOS (universal) and Ubuntu x86_64.
#
# Third-party actions are pinned by commit SHA (the tag is in the comment); update them on purpose, not by accident.
#
# Structure follows obsproject/obs-plugintemplate (CMake presets, buildspec.json
# pins OBS 31.1.1 and the obs-deps used to build libobs), without its zsh/pwsh
# helper scripts. The module is built against libobs 31.1.1, the oldest release
# we support: OBS refuses to load plugins built for a newer major version, but
# loads plugins built for an older one.
#
# Versions follow the desktop app: every build is MAJOR.MINOR.<run number> (MAJOR.MINOR from buildspec.json, 0.1.57),
# a pushed tag obs-plugin-vX.Y.Z builds exactly X.Y.Z (cmake/ci-version.cmake). The number reaches the build as the
# ACW_VERSION environment variable, so the plugin's compiled version, the package names, the .deb version and the
# release title all say the same. The rolling obs-plugin-latest pre-release carries a signed obs-plugin-manifest.json that the plugin
# reads through our download server (once per OBS start) to offer the update.
name: OBS plugin

on:
  push:
    branches: [main, on-prem]
    tags: ["obs-plugin-v*"]
    paths: ["obs-plugin/**", "!obs-plugin/README.md", ".github/workflows/obs-plugin.yml"]
  pull_request:
    paths: ["obs-plugin/**", "!obs-plugin/README.md", ".github/workflows/obs-plugin.yml"]
  workflow_dispatch:

concurrency:
  group: obs-plugin-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CONFIG: RelWithDebInfo

defaults:
  run:
    working-directory: obs-plugin

jobs:
  # ---------------------------------------------------------------------------
  # Core library + tests, no OBS needed (fast feedback): the offline unit tests and the loopback tests, where
  # the real session talks to a fake server on 127.0.0.1 (handshake, errors, retries, late replies, garbage).
  core-tests:
    name: Core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev
      - name: Configure
        run: cmake --preset core-tests -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build --preset core-tests
      - name: Unit and loopback tests
        run: ctest --test-dir build_tests --output-on-failure

  # ---------------------------------------------------------------------------
  # The same tests under AddressSanitizer + UBSan and under ThreadSanitizer. The network path is threaded
  # (audio thread, network thread, the WebSocket library's threads, the UI thread), which is where races hide.
  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: asan
            name: ASan + UBSan
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined
          - id: tsan
            name: TSan
            flags: -fsanitize=thread -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev
      - name: Let ThreadSanitizer start on this kernel
        if: matrix.id == 'tsan'
        # TSan cannot map its shadow memory with the runners' default address randomisation.
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: |
          cmake -S . -B build_san -G Ninja -DACW_BUILD_PLUGIN=OFF -DACW_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            "-DCMAKE_C_FLAGS=-O1 -g ${{ matrix.flags }}" "-DCMAKE_CXX_FLAGS=-O1 -g ${{ matrix.flags }}" \
            "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}"
      - name: Build
        run: cmake --build build_san
      - name: Unit and loopback tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build_san --output-on-failure

  # ---------------------------------------------------------------------------
  # The same tests with the compilers of the other two platforms. Informational for now: a failure does not hold
  # back the release.
  core-tests-portable:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    defaults:
      run:
        shell: bash
        working-directory: obs-plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The third-party libraries (JSON, WebSocket client, TLS, Opus) are downloaded and compiled by the configure and
      # build steps: keep their sources and objects between runs (they change only with the pins in third_party.cmake).
      - name: Cache the third-party sources and objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: obs-plugin/build_tests/_deps
          key: obs-core-deps-${{ matrix.os }}-${{ hashFiles('obs-plugin/core/cmake/third_party.cmake', 'obs-plugin/core/CMakeLists.txt', 'obs-plugin/CMakeLists.txt', '.github/workflows/obs-plugin.yml') }}
      # The macOS rules of the plugin template need the Xcode generator, which is only for the plugin bundle; the
      # core library and its tests build with the default one. Warnings do not fail this informational build.
      - name: Configure
        run: cmake -S . -B build_tests -DACW_BUILD_PLUGIN=OFF -DACW_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
      - name: Build
        run: cmake --build build_tests --config RelWithDebInfo --parallel
      - name: Unit and loopback tests
        run: ctest --test-dir build_tests -C RelWithDebInfo --output-on-failure

  # ---------------------------------------------------------------------------
  linux:
    name: Ubuntu x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version
        run: cmake -P cmake/ci-version.cmake

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config jq curl ccache \
            extra-cmake-modules libsimde-dev uthash-dev libjansson-dev zlib1g-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xinput-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-composite0-dev libxcomposite-dev libxinerama-dev \
            libgl1-mesa-dev libglvnd-dev libgles2-mesa-dev libegl-dev libwayland-dev libxkbcommon-dev \
            libpci-dev libdrm-dev libudev-dev libcurl4-openssl-dev libmbedtls-dev libpulse-dev libssl-dev

      # The template installs whatever libobs-dev the PPA currently offers (OBS 32+ today), which would
      # stamp the module as built for a newer API. Build the pinned release instead (no Qt, no plugins).
      - name: Build libobs (version pinned in buildspec.json)
        run: |
          ver=$(jq -r '.dependencies["obs-studio"].version' buildspec.json)
          hash=$(jq -r '.dependencies["obs-studio"].hashes["linux-x86_64"]' buildspec.json)
          curl -fsSL -o "$RUNNER_TEMP/obs.tar.gz" "https://github.com/obsproject/obs-studio/archive/refs/tags/${ver}.tar.gz"
          echo "${hash}  $RUNNER_TEMP/obs.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/obs-src" && tar -xzf "$RUNNER_TEMP/obs.tar.gz" -C "$RUNNER_TEMP/obs-src" --strip-components=1
          cmake -S "$RUNNER_TEMP/obs-src" -B "$RUNNER_TEMP/obs-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOBS_CMAKE_VERSION=3.0.0 -DOBS_VERSION_OVERRIDE="${ver}" \
            -DENABLE_PLUGINS=OFF -DENABLE_FRONTEND=OFF -DENABLE_UI=OFF -DENABLE_SCRIPTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/obs-prefix"
          cmake --build "$RUNNER_TEMP/obs-build"
          cmake --install "$RUNNER_TEMP/obs-build"

      - name: Configure plugin
        run: |
          cmake --preset ubuntu-ci-x86_64 -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/obs-prefix" -DCMAKE_INSTALL_PREFIX=/usr \
            -DACW_BUILD_TESTS=ON
      - name: Build plugin
        run: cmake --build --preset ubuntu-ci-x86_64
      - name: Unit and loopback tests
        run: ctest --test-dir build_x86_64 --output-on-failure
      - name: Check the module API version
        run: |
          # 0x1f01xxxx = libobs API 31.1.x
          objdump -d --disassemble=obs_module_ver build_x86_64/audio-cleaner.so | grep -E 'mov +\$0x1f01' 
      - name: Check the module carries the build's version
        run: |
          # The version the plugin compares with the newest one on GitHub is a string inside the module.
          strings -a build_x86_64/audio-cleaner.so | grep -Fx -- "$ACW_VERSION"

      - name: Package
        run: |
          name=$(jq -r .name buildspec.json); version="$ACW_VERSION"
          cmake --install build_x86_64 --config "$CONFIG" --strip --prefix "$PWD/release/$CONFIG"
          cpack -G DEB --config build_x86_64/CPackConfig.cmake -B "$PWD/release"
          # "Other Linux": a ready plugin folder, to be unpacked into ~/.config/obs-studio/plugins/
          stage=$(mktemp -d)
          mkdir -p "$stage/$name/bin/64bit" "$stage/$name/data"
          cp release/"$CONFIG"/lib/*/obs-plugins/"$name".so "$stage/$name/bin/64bit/"
          cp -r release/"$CONFIG"/share/obs/obs-plugins/"$name"/. "$stage/$name/data/"
          tar -C "$stage" -cJf "release/${name}-${version}-ubuntu-x86_64.tar.xz" "$name"
          ls -l release
      - name: Check the packages hold the plugin and nothing else
        run: |
          # No static libraries or headers of the bundled libraries, nothing that could clash with a system package.
          name=$(jq -r .name buildspec.json)
          for f in release/*.deb; do
            bad=$(dpkg-deb -c "$f" | awk '$1 !~ /^d/ {print $6}' |
              grep -Ev "^\./usr/(lib/[^/]+/obs-plugins/${name}\.so|share/obs/obs-plugins/${name}/(locale/en-US\.ini|LICENSE|THIRD_PARTY_LICENSES\.md))\$" || true)
            [ -z "$bad" ] || { echo "::error::unexpected files in $f:"; echo "$bad"; exit 1; }
            dpkg-deb -I "$f" | grep -E 'Maintainer|Description'
            [ "$(dpkg-deb -f "$f" Version)" = "$ACW_VERSION" ] || { echo "::error::$f has version $(dpkg-deb -f "$f" Version), not $ACW_VERSION"; exit 1; }
          done
          bad=$(tar -tJf release/*-ubuntu-x86_64.tar.xz | grep -v '/$' |
            grep -Ev "^${name}/(bin/64bit/${name}\.so|data/(locale/en-US\.ini|LICENSE|THIRD_PARTY_LICENSES\.md))\$" || true)
          [ -z "$bad" ] || { echo "::error::unexpected files in the tarball:"; echo "$bad"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audio-cleaner-ubuntu-x86_64
          path: |
            obs-plugin/release/*.deb
            obs-plugin/release/*.tar.xz

  # ---------------------------------------------------------------------------
  macos:
    name: macOS universal
    runs-on: macos-15
    env:
      # --- code signing: NOT IMPLEMENTED, placeholders only (see README "Signing") -------------
      # Ad-hoc signature ("-") is used unless a Developer ID identity is provided.
      CODESIGN_IDENT: "-"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version
        run: cmake -P cmake/ci-version.cmake
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.1.0.app/Contents/Developer
      # Configure fetches the OBS sources and obs-deps and builds libobs from them (~2.5 min): keep the result, it
      # only changes with the pins in buildspec.json. The downloaded archives are not kept (hash-checked again).
      - name: Cache OBS sources, obs-deps and libobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            obs-plugin/.deps
            !obs-plugin/.deps/*.tar.xz
            !obs-plugin/.deps/*.tar.gz
          key: obs-deps-${{ runner.os }}-${{ hashFiles('obs-plugin/buildspec.json', 'obs-plugin/CMakePresets.json', 'obs-plugin/cmake/common/buildspec_common.cmake', 'obs-plugin/cmake/macos/buildspec.cmake') }}
      - name: Configure (downloads OBS 31.1.1 sources + obs-deps pinned in buildspec.json)
        run: cmake --preset macos-ci
      - name: Build
        run: |
          name=$(jq -r .name buildspec.json)
          cd build_macos
          xcodebuild ONLY_ACTIVE_ARCH=NO -arch arm64 -arch x86_64 -project "${name}.xcodeproj" -target "${name}" \
            -destination "generic/platform=macOS,name=Any Mac" -configuration "$CONFIG" -parallelizeTargets \
            -hideShellScriptEnvironment build
      - name: Install
        run: cmake --install build_macos --config "$CONFIG" --prefix "$PWD/release/$CONFIG"

      # TODO(signing): Apple Developer ID Application certificate + notarization.
      #   1. import the .p12 from secrets into a temporary keychain (security create-keychain / import),
      #   2. re-run the build with CODESIGN_IDENT="Developer ID Application: <Name> (<TEAMID>)" and CODESIGN_TEAM,
      #   3. codesign --options runtime --timestamp release/*/audio-cleaner.plugin,
      #   4. xcrun notarytool submit <zip> --apple-id ... --team-id ... --password ... --wait; xcrun stapler staple.
      - name: Sign and notarize (placeholder, not implemented)
        if: ${{ false }}
        run: echo "see the README section on signing"

      - name: Package
        run: |
          name=$(jq -r .name buildspec.json); version="$ACW_VERSION"
          cd "release/$CONFIG"
          # No debug symbols in what we ship (they list the build machine's object file paths).
          strip -S "${name}.plugin/Contents/MacOS/${name}"
          XZ_OPT=-T0 tar -cJf "../${name}-${version}-macos-universal.tar.xz" "${name}.plugin"
          lipo -archs "${name}.plugin/Contents/MacOS/${name}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audio-cleaner-macos-universal
          path: obs-plugin/release/*.tar.xz

  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: obs-plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version
        run: cmake -P cmake/ci-version.cmake
      # Same as on the Mac: OBS sources, obs-deps and the libobs built from them, kept between runs.
      - name: Cache OBS sources, obs-deps and libobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            obs-plugin/.deps
            !obs-plugin/.deps/*.zip
          key: obs-deps-${{ runner.os }}-${{ hashFiles('obs-plugin/buildspec.json', 'obs-plugin/CMakePresets.json', 'obs-plugin/cmake/common/buildspec_common.cmake', 'obs-plugin/cmake/windows/buildspec.cmake') }}
      - name: Configure (downloads OBS 31.1.1 sources + obs-deps pinned in buildspec.json)
        run: cmake --preset windows-ci-x64
      - name: Build
        run: cmake --build --preset windows-ci-x64 --config $env:CONFIG --parallel -- /consoleLoggerParameters:Summary /noLogo
      - name: Install
        run: cmake --install build_x64 --config $env:CONFIG --prefix "$PWD/release/$env:CONFIG"

      # TODO(signing): Authenticode. Sign release/*/audio-cleaner/bin/64bit/audio-cleaner.dll with signtool
      # (or Azure Trusted Signing / a cloud HSM) and timestamp it:
      #   signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f cert.pfx /p $env:PFX_PASSWORD <dll>
      - name: Sign (placeholder, not implemented)
        if: ${{ false }}
        run: echo "see the README section on signing"

      - name: Package
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          $out = "release/$($spec.name)-$env:ACW_VERSION-windows-x64.zip"
          # Debug symbols stay out of what we ship (the .pdb lists the build machine's paths).
          Get-ChildItem "release/$env:CONFIG" -Recurse -Filter *.pdb | Remove-Item -Force
          Compress-Archive -Force -Path "release/$env:CONFIG/*" -DestinationPath $out
          Get-Item $out
      - name: Check the package holds the plugin folder and nothing else
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Get-Item release/*-windows-x64.zip).FullName)
          try {
            $names = $zip.Entries | Where-Object { $_.Name -ne '' } | ForEach-Object { $_.FullName -replace '\\', '/' }
          } finally { $zip.Dispose() }
          $names | ForEach-Object { "  $_" }
          $bad = $names | Where-Object { $_ -notmatch '^audio-cleaner/(bin/64bit/audio-cleaner\.dll|data/.+)$' }
          if ($bad) { throw "unexpected files in the zip: $($bad -join ', ')" }
          if (-not ($names -contains 'audio-cleaner/bin/64bit/audio-cleaner.dll')) { throw 'the dll is missing from the zip' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audio-cleaner-windows-x64
          path: obs-plugin/release/*.zip

  # ---------------------------------------------------------------------------
  # Every successful build of main / on-prem replaces the "obs-plugin-latest" pre-release, so
  # https://github.com/<repo>/releases/tag/obs-plugin-latest always has the newest plugin. It is a
  # pre-release and never marked latest (the repository's releases/latest link belongs to the
  # desktop app). Its title carries the version, and its signed obs-plugin-manifest.json (uploaded last, once the
  # files are there) is what our download server mirrors and installed plugins read to offer the update. A hand-made
  # obs-plugin-v<version> tag publishes a permanent release instead, without a manifest.
  release:
    name: GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/obs-plugin-v') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/on-prem'))
    needs: [core-tests, sanitizers, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: obs-plugin-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            obs-plugin/buildspec.json
            obs-plugin/cmake/ci-version.cmake
          sparse-checkout-cone-mode: false

      - name: Version
        run: cmake -P obs-plugin/cmake/ci-version.cmake

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: audio-cleaner-*
          merge-multiple: true
          path: release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Signs obs-plugin-manifest.json (Ed25519). Our download server only passes on a manifest with a good
          # signature, and the plugin checks it again before it downloads anything. No secret: no manifest (warning).
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: lkLV2nf15eOuttdcqpieY2QJFyPsF4WOIwidisbp6Hw=
        run: |
          version="$ACW_VERSION"
          cd release
          ls -l
          # One clearly named file per kind of computer (the build artifacts keep CMake/CPack's names).
          shopt -s nullglob
          one() { local m=("$@"); [ "${#m[@]}" -eq 1 ] || { echo "::error::expected one file, got: ${m[*]}"; exit 1; }; echo "${m[0]}"; }
          base="audio-cleaner-obs-plugin-$version"
          mv "$(one *-windows-x64.zip)" "$base-windows.zip"
          mv "$(one *-macos-universal.tar.xz)" "$base-mac.tar.xz"
          mv "$(one *.deb)" "$base-ubuntu-debian.deb"
          mv "$(one *-ubuntu-x86_64.tar.xz)" "$base-linux-other.tar.xz"
          files=("$base-windows.zip" "$base-mac.tar.xz" "$base-ubuntu-debian.deb" "$base-linux-other.tar.xz")
          # Nothing users download may name where the plugin is built (the repository or its owner).
          scan="$RUNNER_TEMP/scan"; rm -rf "$scan"; mkdir -p "$scan"/{win,mac,deb,other}
          python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$base-windows.zip" "$scan/win"
          tar -xJf "$base-mac.tar.xz" -C "$scan/mac"; tar -xJf "$base-linux-other.tar.xz" -C "$scan/other"
          dpkg-deb -x "$base-ubuntu-debian.deb" "$scan/deb"; dpkg-deb -f "$base-ubuntu-debian.deb" > "$scan/deb/control.txt"
          leaks=$(grep -rlaiF -e "${GITHUB_REPOSITORY#*/}" -e "${GITHUB_REPOSITORY_OWNER}" "$scan" || true)
          if [ -n "$leaks" ]; then
            echo "::error::these files name the repository or its owner: $leaks"
            for f in $leaks; do strings -n 6 "$f" | grep -aiF -e "${GITHUB_REPOSITORY#*/}" -e "${GITHUB_REPOSITORY_OWNER}" | head -3; done
            exit 1
          fi
          notes="Audio Cleaner OBS plugin $version for OBS 31.1 or newer, built from ${GITHUB_SHA::7}. Not code-signed yet.

          - Windows: $base-windows.zip
          - Mac (Apple silicon and Intel in one file): $base-mac.tar.xz
          - Ubuntu, Debian and Linux Mint: $base-ubuntu-debian.deb (install it like any .deb)
          - Other Linux: $base-linux-other.tar.xz (copy the files into your OBS plugins folder)

          Where each one goes is in obs-plugin/README.md."
          # The signed manifest that installed plugins read (through our download server): version, and per kind of
          # computer the file's name, size, SHA-256 and SHA-512. Keys sorted, compact, no trailing newline.
          signed=()
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::The secret UPDATE_SIGNING_KEY is not set: no plugin manifest, installed plugins will not offer this version."
          else
            key="$RUNNER_TEMP/update-signing-key.pem"
            (umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
            if [ "$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64)" != "$UPDATE_PUBLIC_KEY" ]; then
              echo "::error::UPDATE_SIGNING_KEY does not belong to the public key the plugin trusts: no manifest published."
            else
              python3 - "$version" "${files[@]}" <<'PY'
          import hashlib, json, os, sys
          version, names = sys.argv[1], sys.argv[2:]
          kinds = {"-windows.zip": "windows-x64", "-mac.tar.xz": "macos", "-ubuntu-debian.deb": "ubuntu-debian",
                   "-linux-other.tar.xz": "linux-other"}
          files = {}
          for name in names:
              kind = next(k for suffix, k in kinds.items() if name.endswith(suffix))
              data = open(name, "rb").read()
              files[kind] = {"name": name, "size": len(data), "sha256": hashlib.sha256(data).hexdigest(),
                             "sha512": hashlib.sha512(data).hexdigest()}
          text = json.dumps({"files": files, "version": version}, sort_keys=True, separators=(",", ":"))
          open("obs-plugin-manifest.json", "w", encoding="utf-8", newline="").write(text)
          PY
              openssl pkeyutl -sign -rawin -inkey "$key" -in obs-plugin-manifest.json -out obs-plugin-manifest.json.sig
              openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/update-public.pem"
              openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update-public.pem" -in obs-plugin-manifest.json -sigfile obs-plugin-manifest.json.sig
              signed=(obs-plugin-manifest.json obs-plugin-manifest.json.sig)
            fi
            rm -f "$key"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
              --title "OBS plugin $version" --notes "$notes" "${files[@]}"
          else
            title="OBS plugin $version"
            keep=("${files[@]}" "${signed[@]}")
            # Update the existing release in place, so the download links never 404 while it changes.
            update_in_place() {
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/obs-plugin-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null || return 1
              gh release upload obs-plugin-latest --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}" || return 1
              gh release edit obs-plugin-latest --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease --latest=false || return 1
              # Files of an older version number (they have it in their name) go away, and so does an old manifest when
              # this build has none (the old one would describe files that are gone).
              gh release view obs-plugin-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                while read -r asset; do
                  printf '%s\n' "${keep[@]}" | grep -qxF "$asset" ||
                    gh release delete-asset obs-plugin-latest "$asset" --repo "$GITHUB_REPOSITORY" --yes
                done
              # The manifest last, so nobody is told about a version whose files are not there yet.
              [ "${#signed[@]}" -eq 0 ] || gh release upload obs-plugin-latest --repo "$GITHUB_REPOSITORY" --clobber "${signed[@]}"
            }
            if gh release view obs-plugin-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && update_in_place; then
              echo "updated obs-plugin-latest in place"
            else
              echo "creating obs-plugin-latest from scratch"
              gh release delete obs-plugin-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
              gh release create obs-plugin-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
                --title "$title" --notes "$notes" "${files[@]}"
              [ "${#signed[@]}" -eq 0 ] || gh release upload obs-plugin-latest --repo "$GITHUB_REPOSITORY" --clobber "${signed[@]}"
            fi
          fi
