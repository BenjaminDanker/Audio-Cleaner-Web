# Builds the Audio Cleaner desktop app: installer for Windows x64, installer packages (.pkg) for macOS arm64 and x86_64.
#
# Stages: FFmpeg (LGPL-only, built from source) and libDF (DeepFilterNet's C library) per platform, then the
# app per platform (tests, PyInstaller, frozen --selftest incl. the window, installer: Inno Setup / .pkg; Windows
# also installs and uninstalls it once). A separate job checks that every model the installers download is where the
# catalog says (it can fail on its own without stopping the builds). Push a tag desktop-vX.Y.Z whose
# version matches audio_cleaner_desktop.__version__ to publish a GitHub Release with the three installers
# (GitHub shows each file's SHA-256). Signing is optional and only happens when the secrets exist (docs/desktop.md lists them):
#   macOS    MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD (+ APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD to notarize)
#   Windows  AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#            AZURE_SIGNING_PROFILE (Azure Artifact Signing)
# Every third-party action is pinned to a full commit SHA.
name: Desktop app

# Builds the installers (as downloadable artifacts) whenever a push changes what goes into the app, so
# website/server-only pushes never wait on it; a desktop-v* tag also publishes a GitHub Release; "Run
# workflow" builds by hand. Cold ~20-30 min, much less once the FFmpeg/libDF caches exist.
on:
  push:
    branches: [main, on-prem]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - "common/**"
      - "native/deepfilter/**"
      - "deploy/fetch-dpdfnet.sh"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # The models the installers download (resources.py): HEAD the models archive (AudioCleaner-models-v1.zip on the
  # models-v1 release) and the speech model's files and compare the sizes with the catalog. Fails when one is
  # missing (e.g. the archive was not uploaded to the release) or differs. Nothing needs this job, so a
  # red result here does not stop the builds or the release; look at it before announcing a build.
  model-urls:
    name: Model downloads exist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check the models archive and the speech model files against the catalog
        run: python desktop/packaging/check_model_urls.py

  # ---------------------------------------------------------------------------
  # LGPL-only FFmpeg + libopus + LAME, static, from pinned source tarballs (desktop/packaging/build_ffmpeg.sh).
  # The Windows build is cross-compiled with mingw-w64 on Linux.
  ffmpeg:
    name: FFmpeg ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x86_64, os: ubuntu-24.04 }
          - { platform: macos-arm64, os: macos-15 }
          - { platform: macos-x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the build
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles('desktop/packaging/build_ffmpeg.sh') }}

      - name: Install build tools (Linux, mingw-w64 cross compiler)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mingw-w64 nasm pkg-config make xz-utils curl

      - name: Install build tools (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          brew install pkgconf
          if [ "$(uname -m)" = x86_64 ]; then brew install nasm; fi

      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          REQUIRE_ASM: "1"
        run: bash desktop/packaging/build_ffmpeg.sh "${{ matrix.platform }}" ffmpeg-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: ffmpeg-out
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # DeepFilterNet libDF C library (native/deepfilter/build.sh) + the DFN3 model from the same checkout
  # + the licence notices that need the Rust toolchain (crate list).
  libdf:
    name: libDF ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x86_64, os: windows-2025, lib: df.dll, rust_target: x86_64-pc-windows-msvc }
          - { platform: macos-arm64, os: macos-15, lib: libdf.dylib, rust_target: aarch64-apple-darwin }
          - { platform: macos-x86_64, os: macos-15-intel, lib: libdf.dylib, rust_target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/dfn-build/target
          key: libdf-${{ matrix.platform }}-${{ hashFiles('native/deepfilter/Cargo.lock', 'native/deepfilter/tract-0.23.patch', 'native/deepfilter/build.sh') }}
          restore-keys: libdf-${{ matrix.platform }}-

      - name: Build libDF
        run: |
          export BUILD_DIR="$HOME/dfn-build" OUT="$HOME/dfn-out"
          bash native/deepfilter/build.sh native
          mkdir -p libdf-out
          cp "$OUT/${{ matrix.lib }}" libdf-out/
          cp "$BUILD_DIR/models/DeepFilterNet3_onnx.tar.gz" libdf-out/

      - name: Licence notices (Rust crates, DeepFilterNet)
        run: |
          src="$HOME/dfn-build"
          if command -v cygpath >/dev/null 2>&1; then src="$(cygpath -m "$src")"; fi
          python desktop/packaging/prepare_vendor.py --write-deepfilter-notices libdf-out \
            --deepfilter-src "$src" --rust-target "${{ matrix.rust_target }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libdf-${{ matrix.platform }}
          path: libdf-out
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  app:
    name: App ${{ matrix.platform }}
    needs: [ffmpeg, libdf]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x86_64, os: windows-2025, lib: df.dll, rust_target: x86_64-pc-windows-msvc, pathsep: ";" }
          - { platform: macos-arm64, os: macos-15, lib: libdf.dylib, rust_target: aarch64-apple-darwin, pathsep: ":" }
          - { platform: macos-x86_64, os: macos-15-intel, lib: libdf.dylib, rust_target: x86_64-apple-darwin, pathsep: ":" }
    env:
      PYTHONPATH: ${{ github.workspace }}/desktop${{ matrix.pathsep }}${{ github.workspace }}/common
      ACW_DESKTOP_VENDOR: ${{ github.workspace }}/desktop/vendor
      ACW_ICON_DIR: ${{ github.workspace }}/build/icons
      HF_HOME: ${{ github.workspace }}/.hf-cache
      QT_QPA_PLATFORM: offscreen
      # Signing is optional: these are 'true' only when the secrets exist (never for pull requests).
      MAC_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && github.event_name != 'pull_request' }}
      MAC_NOTARIZE: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' && github.event_name != 'pull_request' }}
      WIN_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_SIGNING_ACCOUNT != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            desktop/requirements.lock
            desktop/requirements-build.lock

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: build/ffmpeg
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libdf-${{ matrix.platform }}
          path: build/libdf

      - name: Install Python dependencies (every package pinned by hash)
        # The two locks list each package with the sha256 of every file PyPI has for it (packaging/hash_lock.py
        # regenerates them): pip refuses anything that does not match, or that is not listed.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r desktop/requirements.lock -r desktop/requirements-build.lock

      - name: Version
        run: |
          version="$(python -c "from audio_cleaner_desktop import __version__ as v; print(v, end='')")"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "desktop-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $version (expected desktop-v$version)"
            exit 1
          fi

      - name: Cache the subtitle model download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache
          key: whisper-small-${{ hashFiles('desktop/packaging/prepare_vendor.py') }}

      - name: Heavy-noise model (DPDFNet-8, pinned and verified)
        run: bash deploy/fetch-dpdfnet.sh build/dpdfnet

      - name: Assemble the vendor directory (native pieces, models, licence notices)
        run: |
          python desktop/packaging/prepare_vendor.py \
            --libdf "build/libdf/${{ matrix.lib }}" \
            --ffmpeg-dir build/ffmpeg \
            --model build/libdf/DeepFilterNet3_onnx.tar.gz \
            --dpdfnet build/dpdfnet/dpdfnet8_48khz_hr.onnx \
            --deepfilter-notices build/libdf \
            --download-whisper \
            --out desktop/vendor

      - name: Tests (common + desktop, headless)
        run: python -m pytest -q common/tests desktop/tests

      - name: Models for the frozen selftest (restoring highs, rebuilding the voice)
        # Lets the frozen selftest run AP-BWE and Sidon through the bundled onnxruntime (one 0.9 GB archive, which
        # the first download unpacks for both). The speech model is left out (1.6 GB). Does not fail the build when the release with the models is not there yet: the
        # "Model downloads exist" job reports that.
        continue-on-error: true
        run: |
          ACW_DESKTOP_MODELS="$RUNNER_TEMP/acw-models" python - <<'PY'
          from audio_cleaner_desktop import models, resources
          for m in (resources.HIGHS_MODEL, resources.VOICE_MODEL):
              models.download(m)
          PY
          echo "ACW_DESKTOP_MODELS=$RUNNER_TEMP/acw-models" >> "$GITHUB_ENV"

      - name: Icons
        run: python desktop/packaging/make_icons.py build/icons

      - name: PyInstaller
        run: pyinstaller desktop/packaging/audio_cleaner.spec --distpath dist --workpath build/pyinstaller --noconfirm

      # ----- Windows ----------------------------------------------------------------------------
      - name: Frozen selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The exe is windowed: without a console it writes to audio-cleaner-cli.log in the temp folder.
          # --gui also builds the window, the preview and the About box, which finds a missing Qt plugin.
          $log = Join-Path $env:TEMP 'audio-cleaner-cli.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath 'dist\AudioCleaner\AudioCleaner.exe' -ArgumentList '--selftest', '--gui' -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "selftest exited with code $($p.ExitCode)" }
          if ((Test-Path $log) -and -not (Select-String -Path $log -Pattern 'selftest ok' -Quiet)) { throw 'selftest did not report ok' }

      - name: Frozen selftest and a cleaned file under a non-ASCII profile name (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Profile folders with accents or CJK letters are common; the native libraries must cope with them.
          $profile_ = Join-Path $env:RUNNER_TEMP ('Zo' + [char]0xEB + ' ' + [char]0x9332 + [char]0x97F3)
          New-Item -ItemType Directory -Force -Path "$profile_\AppData\Local\Temp", "$profile_\in" | Out-Null
          python -c "import sys, numpy as np; from scipy.io import wavfile; t=np.arange(48000*4)/48000; x=0.2*np.sin(2*np.pi*220*t)+0.03*np.random.default_rng(0).standard_normal(t.size); wavfile.write(sys.argv[1], 48000, (x*32767).astype(np.int16))" "$profile_\in\talk.wav"
          $env:USERPROFILE = $profile_
          $env:LOCALAPPDATA = "$profile_\AppData\Local"
          $env:TEMP = "$profile_\AppData\Local\Temp"
          $env:TMP = $env:TEMP
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\AudioCleaner\AudioCleaner.exe'
          $log = Join-Path $env:TEMP 'audio-cleaner-cli.log'
          foreach ($args_ in @(@('--selftest', '--gui'), @('--cli', ('"{0}"' -f "$profile_\in\talk.wav")))) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList $args_ -Wait -PassThru
            if (Test-Path $log) { Get-Content $log }
            if ($p.ExitCode -ne 0) { throw "AudioCleaner $args_ exited with code $($p.ExitCode)" }
          }
          if (-not (Test-Path "$profile_\in\talk-cleaned.wav")) { throw 'the cleaned file was not written' }

      - name: Sign the program files (Windows)
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\AudioCleaner
          files-folder-filter: exe,dll,pyd
          files-folder-depth: 8
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($p in "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") {
              if (Test-Path $p) { $iscc = $p; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup --version=6.7.1 --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $ws = $env:GITHUB_WORKSPACE
          # Setup downloads the models (speech, highs, voice) itself: the list comes from the app's catalog.
          python desktop\packaging\installer_models.py "$ws\build\models.iss"
          if ($LASTEXITCODE -ne 0) { throw "installer_models.py failed ($LASTEXITCODE)" }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$ws\dist\AudioCleaner" "/DOutputDir=$ws\build\installer" `
            "/DIconFile=$ws\build\icons\icon.ico" "/DModelsInclude=$ws\build\models.iss" "$ws\desktop\packaging\windows\AudioCleaner.iss"
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "build\installer\AudioCleaner-Setup-$env:APP_VERSION-x64.exe" out\AudioCleaner-Setup-x64.exe

      - name: Sign the installer (Windows)
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\out\AudioCleaner-Setup-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install, start and uninstall the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A silent install skips the model download page, so this checks the installer itself: the files, the
          # installed program, the uninstaller. Models are never downloaded here.
          $dir = Join-Path $env:RUNNER_TEMP 'acw-installed'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'out\AudioCleaner-Setup-x64.exe'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "setup exited with code $($p.ExitCode)" }
          $log = Join-Path $env:TEMP 'audio-cleaner-cli.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$dir\AudioCleaner.exe" -ArgumentList '--selftest', '--gui' -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "the installed program's selftest exited with code $($p.ExitCode)" }
          # Running setup again is an in-place update: no /DIR this time (it reuses the folder), a file that an older
          # version would have left in _internal is gone afterwards, and the models folder is untouched.
          Set-Content "$dir\_internal\left-by-an-older-version.txt" 'x'
          New-Item -ItemType Directory -Force -Path "$dir\models\keep" | Out-Null
          Set-Content "$dir\models\keep\downloaded.bin" 'x'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/LOG=$env:RUNNER_TEMP\setup2.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup2.log"; throw "the second setup exited with code $($p.ExitCode)" }
          if (Test-Path "$dir\_internal\left-by-an-older-version.txt") { throw 'an update left a file of the older version behind' }
          if (-not (Test-Path "$dir\models\keep\downloaded.bin")) { throw 'an update removed the models folder' }
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$dir\AudioCleaner.exe" -ArgumentList '--selftest', '--gui' -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "the updated program's selftest exited with code $($p.ExitCode)" }
          $p = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the uninstaller exited with code $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\AudioCleaner.exe") { throw 'the uninstaller left the program behind' }

      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: out/AudioCleaner-Setup-x64.exe
          archive: false
          if-no-files-found: error

      # ----- macOS ------------------------------------------------------------------------------
      - name: Frozen selftest and version (macOS)
        if: runner.os == 'macOS'
        run: |
          exe="dist/Audio Cleaner.app/Contents/MacOS/AudioCleaner"
          "$exe" --version
          "$exe" --selftest --gui | tee selftest.log
          grep -q "selftest ok" selftest.log

      - name: Import the signing certificate (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "::error::no 'Developer ID Application' identity in the certificate"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Sign the app (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        run: bash desktop/packaging/macos/sign_app.sh "dist/Audio Cleaner.app" "$MACOS_SIGN_IDENTITY"

      - name: Notarize the app (macOS)
        if: runner.os == 'macOS' && env.MAC_NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash desktop/packaging/macos/notarize.sh "dist/Audio Cleaner.app"

      - name: Installer package (macOS; its setup step downloads the models)
        if: runner.os == 'macOS'
        run: |
          arch="${{ matrix.platform }}"; arch="${arch#macos-}"
          mkdir -p out
          python desktop/packaging/installer_models.py --mac build/pkg-scripts
          PKG_ARCH="$([ "$arch" = arm64 ] && echo arm64 || echo x86_64)" bash desktop/packaging/macos/make_pkg.sh "dist/Audio Cleaner.app" "out/AudioCleaner-macOS-$arch.pkg" \
            "$APP_VERSION" build/pkg-scripts
          echo "PKG=out/AudioCleaner-macOS-$arch.pkg" >> "$GITHUB_ENV"
          # The package must carry both setup scripts: preinstall removes the installed app (an update replaces it
          # completely), postinstall downloads the models that are missing.
          pkgutil --expand-full "out/AudioCleaner-macOS-$arch.pkg" "$RUNNER_TEMP/pkg-check"
          for script in preinstall postinstall; do
            test -x "$RUNNER_TEMP/pkg-check/AudioCleaner-component.pkg/Scripts/$script" || { echo "::error::the package has no $script script"; exit 1; }
          done

      - name: Upload installer package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.PKG }}
          archive: false
          if-no-files-found: error

      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS' && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

  # ---------------------------------------------------------------------------
  # Every successful build of main / on-prem is published, so the newest installers are always at
  # .../releases/latest: tag desktop-v<version>-build.<run number>, and only the newest 5 such automatic
  # releases are kept. A hand-made desktop-v<version> tag publishes a release of that exact version.
  release:
    name: GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/on-prem'))
    needs: app
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: desktop/audio_cleaner_desktop/__init__.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: AudioCleaner-*
          merge-multiple: true
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' desktop/audio_cleaner_desktop/__init__.py)"
          [ -n "$version" ] || { echo "::error::could not read __version__"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            title="Audio Cleaner $version"
          else
            tag="desktop-v$version-build.$GITHUB_RUN_NUMBER"
            title="Audio Cleaner $version (build $GITHUB_RUN_NUMBER)"
          fi
          cd release
          # Friendlier names for the release page (the build artifacts keep the platform names).
          mv AudioCleaner-Setup-x64.exe "AudioCleaner-$version-Windows.exe"
          mv AudioCleaner-macOS-arm64.pkg "AudioCleaner-$version-Mac-Apple-silicon.pkg"
          mv AudioCleaner-macOS-x86_64.pkg "AudioCleaner-$version-Mac-Intel.pkg"
          files=("AudioCleaner-$version-Windows.exe" "AudioCleaner-$version-Mac-Apple-silicon.pkg" "AudioCleaner-$version-Mac-Intel.pkg")
          notes="Audio Cleaner $version, built from ${GITHUB_SHA::7}.

          - Windows 10 or 11: AudioCleaner-$version-Windows.exe
          - Mac with Apple silicon (M1 and newer), macOS 14 or newer: AudioCleaner-$version-Mac-Apple-silicon.pkg
          - Mac with an Intel processor, macOS 14 or newer: AudioCleaner-$version-Mac-Intel.pkg

          Setup downloads the models (about 2.5 GB in all, once), so keep the internet on while it installs; on a Mac
          it can take several minutes. They are Whisper large-v3-turbo for subtitles (1.6 GB) and one archive with
          AP-BWE for restoring the highs of phone-quality recordings and Sidon for rebuilding voices (0.9 GB), which
          setup unpacks for you. After that everything works offline. If a download fails, the app still works and offers it in Settings.

          Not sure which Mac you have? Apple menu > About This Mac: \"Chip\" means Apple silicon, \"Processor\" means Intel."
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "$title" --notes "$notes" "${files[@]}"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "$title" --notes "$notes" "${files[@]}"
          fi

      - name: Keep only the newest 5 automatic releases
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^desktop-v.*-build\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            echo "removing $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
