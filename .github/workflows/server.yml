# Checks for the server, the shared audio code, the live engine, the website and the deploy scripts: the server and
# common tests on Python 3.12 with the locked packages (the same set production runs), a lint of the Python code for unused and undefined
# names, the live engine's unit tests (native/live), the website build, the Terms/Privacy text test and the website's unit suites that need no
# browser or models, and shellcheck on deploy/*.sh (the host scripts and the acw-* wrappers in deploy/host/ included). Tests that need FFmpeg, libDF or the models skip themselves here; they run on the production host.
# Every third-party action is pinned to a full commit SHA.
name: Server and website

on:
  push:
    branches: [main, on-prem, desktop-merge]
    paths:
      - "server/**"
      - "common/**"
      - "web/**"
      - "deploy/**"
      - "native/live/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "common/**"
      - "web/**"
      - "deploy/**"
      - "native/live/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Server and common tests (Python 3.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.lock

      - name: Install the locked packages and the test tools
        run: |
          # libopus: live Opus frames (the server loads it with ctypes, as on the host)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopus0
          python -m pip install --upgrade pip
          # Every file is checked against the sha256 recorded in the lock (deploy/hash_lock.py).
          pip install --require-hashes -r server/requirements.lock
          pip install "pytest>=8" "pytest-asyncio>=0.23"

      - name: Package lock files are well formed (hashes present)
        run: python deploy/hash_lock.py --verify server/requirements.lock deploy/requirements-gpu.lock

      - name: Lint (unused and undefined names)
        # Pinned to one version so a new release's rules never fail the build by themselves.
        run: |
          pip install ruff==0.17.2
          ruff check --select F server/acw common/acw_common

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Website packages (the server tests that compare the website's code with the server's run it with node)
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Server tests
        run: cd server && python -m pytest -q

      - name: Common tests
        run: cd common && python -m pytest -q

      - name: Live engine tests (native/live)
        # The engine links the sherpa-onnx C library that the locked Python package ships (native/live/build.sh).
        run: |
          export SHERPA_ONNX_LIB_DIR="$(python -c 'import os, sherpa_onnx; print(os.path.join(os.path.dirname(sherpa_onnx.__file__), "lib"))')"
          cd native/live && cargo test --release --locked

  web:
    name: Website builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          # The noise remover's glue code comes from the production host's build (its WebAssembly and model from Hugging
          # Face); stand-ins let the build run.
          mkdir -p public/dfn
          for f in df.js LICENSE-MIT LICENSE-APACHE; do echo stand-in > "public/dfn/$f"; done
          npm run build

      - name: Terms and Privacy text (renders, hashes the same way every time, versions are decided from the hash)
        # No server archive needed: deploy/legal-archive.sh does the real versioning on the production host (docs/operations.md, "Legal versions").
        working-directory: web
        run: node tests/legal-versions.mjs

      - name: Unit suites (no browser, no backend, no models)
        # The editor's tracks, mapping and prices (studio-unit), its timeline and mix (editor-unit), the strength slider's numbers (blend-unit), the file-type
        # list and what the website quotes for a video (convert-unit) and the automatic settings model (reco-model; its comparison with the training
        # output skips itself without it). Not reco-unit: it runs the noise remover's WebAssembly and model from disk, which only the host has.
        working-directory: web
        run: |
          for suite in studio-unit editor-unit blend-unit convert-unit reco-model; do
            echo "== $suite"
            node "tests/$suite.mjs"
          done

  shell:
    name: Deploy scripts (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck deploy/*.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning deploy/*.sh deploy/vps/*.sh deploy/host/move-*.sh deploy/host/fix-venv-paths.sh deploy/host/acw-*
