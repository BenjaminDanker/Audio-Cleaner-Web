services:
  streaming:
    build:
      # Compose file lives inside the processor/ directory already, so context is current dir
      context: .
      dockerfile: Dockerfile.streaming
    ports:
      - "8000:8000"
    env_file:
      - ./.env.cloud
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount source code for hot-reload style iteration; remove for prod-like testing
      - ./shared:/app/shared
      - ./streaming:/app/streaming
    restart: unless-stopped
    networks:
      - audio-cleaner-dev

  # Optional: Add Azurite for local storage testing if needed
  # azurite:
  #   image: mcr.microsoft.com/azure-storage/azurite
  #   ports:
  #     - "10000:10000"  # Blob service
  #     - "10001:10001"  # Queue service
  #     - "10002:10002"  # Table service
  #   volumes:
  #     - azurite-data:/data
  #   command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
  #   networks:
  #     - audio-cleaner-dev

networks:
  audio-cleaner-dev:
    driver: bridge

