# Audio Cleaner: every model and program file production uses, with where it comes from (DEP-01).
#
# Read by deploy/fetch-models.sh, which downloads what is missing or wrong, verifies the sha256 of every file and
# never touches a correct one (deploy/fetch-models.sh --check only verifies). Targets are relative to
# ~/audio-cleaner (ACW_HOME). Columns are separated by whitespace; the last column runs to the end of the line.
#
#   kind     flags     sha256   size     target                         source / note
#   file     -|optional  ...   bytes    models/x/y.onnx                URL (Hugging Face: pinned to one commit)
#   archive  -|optional  ...   bytes    NAME                           URL of an archive some `member` lines come from
#   member   -|optional  ...   bytes    bin/ffmpeg                     NAME:path/inside/the/archive
#   local    -|optional  ...   bytes    bin/libdf.so                   NOTE: cannot be downloaded (built or converted here)
#
# optional: not needed to run the product; checked when present, fetched only with --with-optional.
# local: files that cannot be traced to a download: --check verifies that they exist and match (a different hash
#   is reported as "changed", not as an error: a rebuild legitimately differs); nothing fetches them.
# To change a pin: download the new file, run sha256sum on it, and replace the URL, sha256 and size here.
#   Keep Hugging Face URLs on a commit id, never "main". (The free tools' models are not here: visitors' browsers
#   download them from Hugging Face themselves, pinned in web/src/media/models.js.)
# Our own models (the ones we convert or export) are in the Hugging Face repo SilverJunk08/audio-cleaner-models, pinned
#   to one commit like every other Hugging Face file: the desktop app (resources.py) and the website (web/src/media)
#   pin the same commit. New or changed models are a new commit there; then update the pins here and in those places.
#
# Sources (all verified byte for byte against the files in production on 2026-10-15):
#   DeepFilterNet3        github.com/Rikorose/DeepFilterNet (the commit libDF is built from, native/deepfilter/build.sh), our copy in
#                         SilverJunk08/audio-cleaner-models (byte for byte the same)
#   DPDFNet-8             Ceva-IP/DPDFNet, Apache-2.0: our export with a dynamic batch (tools/export_dpdfnet_batch.py) of the
#                         published weights (Ceva-IP/DPDFNet commit dd6818d, code 9bd9844), in SilverJunk08/audio-cleaner-models
#   Whisper large-v3-turbo, small, base   CTranslate2 conversions (faster-whisper): dropbox-dash/faster-whisper-large-v3-turbo
#                         (renamed from mobiuslabsgmbh/...), Systran/faster-whisper-small, Systran/faster-whisper-base
#                         (base only detects the spoken language: runner.py, docs/research/heavy-2026-10.md)
#   Parakeet TDT v2, v3   istupakov/parakeet-tdt-0.6b-v{2,3}-onnx (onnx-asr layout), CC-BY-4.0
#   Silero VAD            istupakov/silero-vad-onnx (what onnx-asr downloads), MIT
#   Live captions         csukuangfj/sherpa-onnx-nemo-streaming-fast-conformer-transducer-en-480ms-int8
#   AP-BWE, Sidon ONNX    our conversions (tools/export_apbwe_onnx.py, tools/convert_sidon_onnx.py), in
#                         SilverJunk08/audio-cleaner-models; the Sidon TorchScript files come from sarulab-speech/sidon-v0.1
#   FFmpeg / FFprobe      BtbN/FFmpeg-Builds autobuild-2026-10-09-14-16 (n8.1.3-16-ge0a878dd70, GPL, static).
#                         BtbN prunes old daily builds: if this URL ever 404s, take a build that is still there,
#                         replace the btbn-ffmpeg archive line and the two bin/ lines, and keep a copy of the tarball somewhere we control.
#
