AudioCleaner.FilterName="Audio Cleaner (cloud)"
AudioCleaner.ApiKey="API key"
AudioCleaner.ApiKey.Long="Create a key on the Audio Cleaner website with \"OBS plugin and live\" ticked. OBS keeps filter settings, including this key, unencrypted in the scene collection file, so use a key made just for this and do not share scene files."
AudioCleaner.Denoise="Remove background noise"
AudioCleaner.Strength="How much noise to remove"
AudioCleaner.Strength.Long="Gentle keeps some room sound and sounds the most natural; Maximum removes as much as it can. Maximum suits most voices."
AudioCleaner.Strength.Gentle="Gentle"
AudioCleaner.Strength.Balanced="Balanced"
AudioCleaner.Strength.Strong="Strong"
AudioCleaner.Strength.Maximum="Maximum"
AudioCleaner.Echo="Echo cancellation"
AudioCleaner.Echo.Long="Stops people hearing your speakers through your microphone, for example a game or the people you talk with playing twice. Pick the source that plays through your speakers, usually Desktop Audio. It keeps working when that source is muted in the OBS mixer. You do not need this if you wear headphones; choose None then."
AudioCleaner.Echo.None="None"
AudioCleaner.Echo.Desktop="Desktop Audio (default)"
AudioCleaner.Captions="Captions"
AudioCleaner.Captions.Long="Live captions for your stream, shown by players as closed captions. Standard works in English. Extra accurate also works in other languages. Captions are billed while this filter is running, whether or not you are live."
AudioCleaner.Captions.Off="Off"
AudioCleaner.Captions.Local="Standard (English)"
AudioCleaner.Captions.Premium="Extra accurate (any language)"
AudioCleaner.Language="Caption language"
AudioCleaner.Language.Long="Only for Extra accurate captions: pick the language you speak, or let it be detected. Standard captions are always English."
AudioCleaner.Language.auto="Detect automatically"
AudioCleaner.Language.en="English"
AudioCleaner.Language.de="German"
AudioCleaner.Language.fr="French"
AudioCleaner.Language.es="Spanish"
AudioCleaner.Language.it="Italian"
AudioCleaner.Language.pt="Portuguese"
AudioCleaner.Language.nl="Dutch"
AudioCleaner.Language.sv="Swedish"
AudioCleaner.Language.da="Danish"
AudioCleaner.Language.no="Norwegian"
AudioCleaner.Language.fi="Finnish"
AudioCleaner.Language.pl="Polish"
AudioCleaner.Language.cs="Czech"
AudioCleaner.Language.tr="Turkish"
AudioCleaner.Language.ru="Russian (cannot be added to the stream)"
AudioCleaner.Language.uk="Ukrainian (cannot be added to the stream)"
AudioCleaner.Language.ar="Arabic (cannot be added to the stream)"
AudioCleaner.Language.hi="Hindi (cannot be added to the stream)"
AudioCleaner.Language.ja="Japanese (cannot be added to the stream)"
AudioCleaner.Language.ko="Korean (cannot be added to the stream)"
AudioCleaner.Language.zh="Chinese (cannot be added to the stream)"
AudioCleaner.SendCaptions="Send captions to the stream"
AudioCleaner.SendCaptions.Long="Adds the captions to your stream (and your recording) as closed captions while you are live. Captions are only asked for, and billed, when this is on. Languages written in other alphabets, such as Russian, Arabic, Chinese, Japanese, Korean or Hindi, cannot be shown this way."
AudioCleaner.Latency="Delay"
AudioCleaner.Latency.Long="Your audio is delayed by a fixed amount so the cleaned sound has time to come back from the internet. OBS keeps it in sync with the video; only monitoring through OBS is delayed. If the status says your connection is too slow, pick a longer delay. Changing it restarts the connection."
AudioCleaner.Latency.Low="Low (80 ms) - only for a very fast connection"
AudioCleaner.Latency.Balanced="Balanced (150 ms) - good for most connections"
AudioCleaner.Latency.Safe="Safe (250 ms) - slower connections and Wi-Fi"
AudioCleaner.RefreshStatus="Refresh status"
AudioCleaner.RetryNow="Try again"
AudioCleaner.Advanced="Advanced"
AudioCleaner.ServerUrl="Server address"
AudioCleaner.ServerUrl.Long="The wss:// address of the Audio Cleaner live service. Leave it as it is unless you run your own server. An unencrypted ws:// address only works for this computer or your local network."
AudioCleaner.Codec="Audio format"
AudioCleaner.Codec.Opus="Compact (about 60 kbps each way)"
AudioCleaner.Codec.Pcm="Uncompressed (about 770 kbps each way; only if the compact format gives trouble)"
AudioCleaner.Update.Available="Update available: Audio Cleaner plugin %1 (you have %2)"
AudioCleaner.Update.Download="Download the update"
AudioCleaner.Update.Check="Check for updates when OBS starts"
AudioCleaner.Update.Check.Long="Once each time OBS starts, the plugin asks GitHub which plugin version is the newest (GitHub sees your internet address). If there is a newer one, a notice and a download button appear here. Nothing is downloaded or installed by itself. This setting applies to all Audio Cleaner filters."
AudioCleaner.Status.NoKey="Enter an API key to start."
AudioCleaner.Status.NothingEnabled="Turn on noise removal or captions to start."
AudioCleaner.Status.Disabled="The filter is turned off."
AudioCleaner.Status.NotRunning="Not running."
AudioCleaner.Status.EchoWaiting="Echo cancellation: waiting for the speaker source."
AudioCleaner.Status.CaptionsNotSent="Captions are off for the stream, so they are not requested. Turn on \"Send captions to the stream\" to use them."
AudioCleaner.Status.CaptionsLanguage="Captions in this language cannot be added to the stream (the stream's caption format only shows Latin letters), so they are not requested."
