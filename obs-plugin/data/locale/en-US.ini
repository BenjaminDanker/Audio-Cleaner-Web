AudioCleaner.FilterName="Audio Cleaner (cloud)"
AudioCleaner.ApiKey="API key"
AudioCleaner.ApiKey.Long="Create a key on the Audio Cleaner website with \"OBS plugin and live\" ticked. OBS keeps filter settings, including this key, unencrypted in the scene collection file, so use a key made just for this and do not share scene files."
AudioCleaner.Denoise="Remove background noise"
AudioCleaner.Strength="How much noise to remove"
AudioCleaner.Strength.Long="Gentle keeps some room sound and sounds the most natural; Maximum removes as much as it can. Maximum suits most voices."
AudioCleaner.Strength.Gentle="Gentle"
AudioCleaner.Strength.Balanced="Balanced"
AudioCleaner.Strength.Strong="Strong"
AudioCleaner.Strength.Maximum="Maximum"
AudioCleaner.Echo="Echo cancellation"
AudioCleaner.Echo.Long="Stops people hearing your speakers through your microphone, for example a game or the people you talk with playing twice. Pick the source that plays through your speakers, usually Desktop Audio. It keeps working when that source is muted in the OBS mixer. You do not need this if you wear headphones; choose None then."
AudioCleaner.Echo.None="None"
AudioCleaner.Echo.Desktop="Desktop Audio (default)"
AudioCleaner.Captions="Captions"
AudioCleaner.Captions.Long="Live captions for your stream, shown by players as closed captions, and optionally as on-screen text and as subtitle files next to your recordings. Standard works in English. Extra accurate also works in other languages. Captions are billed while this filter is running; with "Only while streaming or recording" ticked (the default) that is only while you stream or record."
AudioCleaner.Captions.Off="Off"
AudioCleaner.Captions.Local="Standard (English)"
AudioCleaner.Captions.Premium="Extra accurate (any language)"
AudioCleaner.Language="Caption language"
AudioCleaner.Language.Long="Only for Extra accurate captions: pick the language you speak, or let it be detected. Standard captions are always English."
AudioCleaner.Language2="Also speaks"
AudioCleaner.Language2.None="(only the one above)"
AudioCleaner.Language2.Long="For extra accurate captions: a second language you switch to while talking (for example English and Spanish). The captions follow the switches. Pick the first language above first."
AudioCleaner.Speaker="Speaker name (optional)"
AudioCleaner.Speaker.Long="Using this filter on more than one microphone? Put each person's name here: their caption lines start with it, so viewers know who is talking. All filters share one caption track and take turns."
AudioCleaner.Split="Left and right are different people"
AudioCleaner.Split.Long="For a stereo source with one person on each side (for example two microphones on one audio interface): each side is cleaned and captioned on its own and stays on its side. This runs two live sessions (billed as two, and your account can run four at a time). Echo cancellation applies to the left side only."
AudioCleaner.SpeakerRight="Right side's name"
AudioCleaner.Speaker.LeftDefault="Left"
AudioCleaner.Speaker.RightDefault="Right"
AudioCleaner.Hint.Split="Several people? Add this filter to each microphone (each one is its own session), or tick the box above for a stereo source with one person per side. Names keep their lines apart."
AudioCleaner.Status.Sides="Left: %1 Right: %2"
AudioCleaner.Status.RightSide="Right side:"
