AudioCleaner.Status.NothingEnabled="Turn on noise removal or captions to start."
AudioCleaner.Status.Disabled="The filter is turned off."
AudioCleaner.Status.NotRunning="Not running."
AudioCleaner.Status.WaitingLive="Waiting for you to go live or record: nothing is billed until then."
AudioCleaner.Status.EchoWaiting="Echo cancellation: waiting for the speaker source."
AudioCleaner.Status.CaptionsNotSent="Captions are not requested because they have nowhere to go. Tick a place under \"Send closed captions to\", pick an on-screen text source, or turn on subtitle files."
AudioCleaner.Status.CaptionsLanguage="Closed captions in this language cannot be added to the stream (the stream's caption format only shows Latin letters), so they are not requested. Choose another closed caption language, or use on-screen text or subtitle files."
