AudioCleaner.CaptionsGroup="Translations and where captions appear"
AudioCleaner.Translate.Info="Translated captions: pick up to three languages. Each final caption is translated a moment after it is spoken (usually within one or two seconds). Every language is billed per second while this filter runs, like the captions themselves. Needs captions turned on above."
AudioCleaner.Translate.Into="Translate captions into"
AudioCleaner.Translate.And="and into"
AudioCleaner.Translate.None="None"
AudioCleaner.Translate.Long="The spoken language is not offered (with Standard captions that is English). Languages are only asked for, and billed, when something shows them: the closed captions, an on-screen text source for that language, or the subtitle files."
AudioCleaner.CcLanguage="Closed caption language"
AudioCleaner.CcLanguage.Same="Same as spoken"
AudioCleaner.CcLanguage.SameNamed="Same as spoken (%1)"
AudioCleaner.CcLanguage.Long="Closed captions carry one language: what you say, or one of the translations. Languages that need other alphabets cannot be shown as closed captions, so they are not offered here; show them as on-screen text or subtitle files instead."
AudioCleaner.SendCaptions.Stream="The stream"
AudioCleaner.SendCaptions.Recording="The recording"
AudioCleaner.SendCaptions.Replay="The replay buffer"
AudioCleaner.SendCaptions.Others="Other outputs (multistream plugins)"
AudioCleaner.SendCaptions.Others.Long="Also puts the captions on the running outputs made by other plugins, such as a second stream from a multistream plugin. They are only captioned while they run, once each. Not every service shows them. Off by default."
AudioCleaner.Overlay.Info="On-screen text shows the captions as text in your scene, one text source per language. Press \"Create text source\" (or pick a text source you made yourself), then put it in a scene with Sources, +, Add Existing. On-screen text is part of the picture, so it shows in both the stream and the recording."
AudioCleaner.Overlay.None="None"
AudioCleaner.Overlay.TextFor="On-screen text for %1"
AudioCleaner.Overlay.Long="The text source this filter writes the captions into: the last lines, cleared after a pause. Use any text source (GDI+ on Windows, FreeType 2 elsewhere), or press the button to make one."
AudioCleaner.Overlay.Create="Create text source for %1"
AudioCleaner.Overlay.SpokenLanguage="the spoken language"
AudioCleaner.Overlay.Name="Audio Cleaner captions (%1)"
AudioCleaner.Overlay.Created="Created the text source \"%1\". It is not in any scene yet: use Sources, +, Add Existing to put it into the scene you want, then size and place it. It is chosen for this language already."
AudioCleaner.Overlay.AlreadyThere="The text source \"%1\" already exists, so it is used for this language. Put it into a scene with Sources, +, Add Existing if it is not in one yet."
AudioCleaner.Overlay.NameTaken="A source called \"%1\" exists and is not a text source. Rename it, or pick a text source from the list."
AudioCleaner.Overlay.NoTextSource="This copy of OBS has no text source this filter can write to."
AudioCleaner.Overlay.Lines="On-screen text: lines at a time"
AudioCleaner.Overlay.Lines.1="One line"
AudioCleaner.Overlay.Lines.2="Two lines"
AudioCleaner.Overlay.Lines.3="Three lines"
AudioCleaner.Overlay.Clear="Clear on-screen text after silence"
AudioCleaner.Subtitles="Save subtitle files with recordings"
AudioCleaner.Subtitles.Long="While OBS records, the captions are collected and, when the recording stops, saved next to it as one subtitle file per language: the recording name plus the language and .srt (for example \"My video.es.srt\"). Players such as VLC pick them up by themselves. If the spoken language is detected automatically, its file has no language in the name. With the recording split into several files, only the one that finished last gets them."
AudioCleaner.Status.CaptionsLanguageOther="Closed captions in this language cannot be added to the stream (Latin letters only); the other places still get them."
AudioCleaner.Status.TranslateIgnored="Translation into %1 is ignored: it is the spoken language, or chosen twice."
AudioCleaner.Status.OverlayMissing="There is no text source called \"%1\"."
AudioCleaner.Status.advice_tip="Tip:"
AudioCleaner.Status.advice_speak="Speak for a few seconds and this will suggest the best settings for your room."
AudioCleaner.Status.advice_quiet="Your room is quiet, so noise removal is not needed. Turn it off to save credit."
AudioCleaner.Status.advice_noisy="Your room is noisy. Turn on noise removal (%1 suits it)."
AudioCleaner.Status.advice_strength="For your room, set the noise removal strength to %1."
AudioCleaner.Status.advice_echo_on="Your speakers can be heard in your microphone. Echo cancellation is taking it out."
AudioCleaner.Status.advice_echo_off="Your speakers can be heard in your microphone. Wear headphones, or turn on echo cancellation."
AudioCleaner.Status.advice_clip="Your microphone is too loud and the sound distorts. Turn its level down."
AudioCleaner.Status.advice_captions_up="Extra accurate captions will catch more words here."
AudioCleaner.Status.advice_captions_down="Standard captions are enough for your clear voice."
AudioCleaner.Status.advice_fits="The settings fit your room."
AudioCleaner.Status.translating="Translating into %1."
AudioCleaner.Status.Warning.captions_unavailable="The caption service had trouble, so captions have stopped. Your audio is not affected."
AudioCleaner.Status.Warning.translation_unavailable="Translation into %1 stopped because the translation service had trouble; the other captions go on."
AudioCleaner.Status.Warning.translation_not_started="The service did not switch on translation into %1."
AudioCleaner.Status.Warning.change_refused="That change could not be made: %1 The session goes on with the earlier settings."
AudioCleaner.Status.Reason.no_audio="The service stopped this session because your microphone audio was not arriving steadily. It starts again by itself when audio flows."
AudioCleaner.Status.Reason.too_many_messages="The service closed the connection because this plugin sent too many messages. Reconnecting in a moment."
AudioCleaner.Status.Reason.trial_over="Your free trial of live processing is over. Add balance on the website, then press Try again."
AudioCleaner.Status.Reason.trial_busy="Live processing for free trials is busy right now. Trying again in a few minutes."
AudioCleaner.Status.Reason.needs_topup="Extra accurate captions need a first top-up on the website. Add balance there (or use Standard captions), then press Try again."
AudioCleaner.Status.Reason.insufficient_funds="There is not enough balance for live processing. Add balance on the website, then press Try again."
AudioCleaner.Status.Reason.captions_unavailable="The caption service stopped working, so this session ended (nothing is billed for it). Trying again in a few minutes."
AudioCleaner.Hint.Denoise="Only a little fan hum? OBS's own Noise Suppression filter may be enough. With an NVIDIA RTX card, NVIDIA Broadcast is free too, and on a Mac the Voice Isolation mic mode (it can swallow music). This one is for when those still leave noise, without using your GPU."
AudioCleaner.Hint.CaptionsLocal="Streaming on YouTube in English with 1,000+ subscribers? YouTube's own live captions are free. This one works on Twitch and everywhere else, with no setup."
AudioCleaner.Hint.CaptionsPremium="Clear English? Standard is usually enough. Extra accurate is for fast talk, noisy rooms, other languages, or when names must be right."
AudioCleaner.Hint.Translate="Twitch and YouTube don't translate live captions themselves, so this is the easy way. Translations are made by software and can be wrong."
