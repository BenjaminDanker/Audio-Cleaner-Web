AudioCleaner.SendCaptions="Send closed captions to"
AudioCleaner.SendCaptions.Long="Closed captions are the captions players show with their CC button. They ride inside the video, so they need no setup in your scene. They carry one language and can only show Latin letters (Russian, Arabic, Chinese, Japanese, Korean, Hindi, Greek, Hebrew and Vietnamese cannot be shown this way). Captions are only asked for, and billed, when something shows them: closed captions, an on-screen text source or the subtitle files."
AudioCleaner.Latency="Delay"
AudioCleaner.Latency.Long="Your audio is delayed by a fixed amount so the cleaned sound has time to come back from the internet. OBS keeps it in sync with the video; only monitoring through OBS is delayed. If the status says your connection is too slow, pick a longer delay. Changing it restarts the connection."
AudioCleaner.Latency.Low="Low (80 ms) - only for a very fast connection"
AudioCleaner.Latency.Balanced="Balanced (150 ms) - good for most connections"
AudioCleaner.Latency.Safe="Safe (250 ms) - slower connections and Wi-Fi"
AudioCleaner.LiveOnly="Only while streaming or recording"
AudioCleaner.LiveOnly.Long="Ticked (the default): nothing runs, and nothing is billed, until OBS is streaming, recording, running the replay buffer or running the virtual camera. It starts as soon as one of them is starting, so it is ready when the output begins, and ends about 10 seconds after the last one stops. Your microphone plays normally, unprocessed, in between. Untick it to keep the filter running all the time, for example to test it or to use it while another plugin does the streaming."
AudioCleaner.Hint.LiveOnly="You pay by the second while the filter runs. A muted microphone and stretches of complete silence are not billed. With the box above ticked nothing is billed while you are not streaming or recording either. Outputs made by other plugins (a second stream, Source Record, NDI) do not count: untick the box if you need the filter then."
AudioCleaner.RefreshStatus="Refresh status"
AudioCleaner.RetryNow="Try again"
AudioCleaner.Advanced="Advanced"
AudioCleaner.ServerUrl="Server address"
AudioCleaner.ServerUrl.Long="The wss:// address of the Audio Cleaner live service. Leave it as it is unless you run your own server. An unencrypted ws:// address only works for this computer or your local network."
AudioCleaner.Codec="Audio format"
AudioCleaner.Codec.Opus="Compact (about 60 kbps each way)"
AudioCleaner.Codec.Pcm="Uncompressed (about 770 kbps each way; only if the compact format gives trouble)"
AudioCleaner.Update.Available="Update available: Audio Cleaner plugin %1 (you have %2)"
AudioCleaner.Update.Download="Download and install the update"
AudioCleaner.Update.TryAgain="Try again"
AudioCleaner.Update.Working="Downloading the update... Open these settings again in a moment to see how it went."
AudioCleaner.Update.OnExit="The update is ready. It installs when you close OBS; it is in use the next time you start OBS."
AudioCleaner.Update.Restart="The update is installed. Restart OBS to use it."
AudioCleaner.Update.InstallerOpen="The installer is open: finish installing there, then restart OBS."
AudioCleaner.Update.FolderShown="This copy of the plugin can't be replaced from inside OBS. The new version is in the folder that just opened: copy it into %1 while OBS is closed."
AudioCleaner.Update.Failed="The update didn't work: %1"
AudioCleaner.Update.Check="Check for updates when OBS starts"
AudioCleaner.Update.Check.Long="Once each time OBS starts, the plugin asks our server which plugin version is the newest (the server sees your internet address and the plugin version). If there is a newer one, a notice and a button appear here; the update is only downloaded and installed when you press the button. This setting applies to all Audio Cleaner filters."
